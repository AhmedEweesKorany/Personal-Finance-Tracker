<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>savewise - category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="category-page">

    <div class="shell">
        <aside class="sidebar">
            <div class="side-logo">
                <span class="logo-icon"><i class="fa-solid fa-leaf"></i></span>
                <span>savewise</span>
            </div>
            <nav class="side-menu">
                <a href="analytics.html" class="side-link"><i class="fa-solid fa-chart-column"></i>analytics</a>
                <a href="#" class="side-link"><i class="fa-solid fa-plus"></i>add transaction</a>
                <a href="Category.html" class="side-link on"><i class="fa-solid fa-list-ul"></i>category</a>
            </nav>
        </aside>

        <main class="content category-content">

            <div class="category-head">
                <div>
                    <h1>categories</h1>
                    <p>manage your expense categories.</p>
                </div>

                <button>
                    <i class="fa-solid fa-plus"></i>
                    add category
                </button>
            </div>




            <div class="category-cards">
                <div class="category-card">

                    <i class="fa-solid fa-utensils category-icon cat-food"></i>
                    <div class="category-meta">
                        <h2>food</h2>
                        <p>12 transactions</p>
                    </div>
                    <p class="category-percent">32%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-bus-simple category-icon cat-transport"></i>
                    <div class="category-meta">
                        <h2>transportation</h2>
                        <p>7 transactions</p>
                    </div>
                    <p class="category-percent">18%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-bag-shopping category-icon cat-shopping"></i>
                    <div class="category-meta">
                        <h2>shopping</h2>
                        <p>5 transactions</p>
                    </div>
                    <p class="category-percent">14%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-children category-icon cat-fun"></i>
                    <div class="category-meta">
                        <h2>entertainment</h2>
                        <p>4 transactions</p>
                    </div>
                    <p class="category-percent">12%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-regular fa-file-lines category-icon cat-bills"></i>
                    <div class="category-meta">
                        <h2>bills</h2>
                        <p>3 transactions</p>
                    </div>
                    <p class="category-percent">10%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-ellipsis category-icon cat-other"></i>
                    <div class="category-meta">
                        <h2>other</h2>
                        <p>4 transactions</p>
                    </div>
                    <p class="category-percent">14%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>

            </div>



        </main>
    </div>



<script src="main.js"></script>
</body>

</html>
