<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <section>
        <div class="title">
            <div class="title1">

                <i class="fa-solid fa-leaf"></i>
                <h2>SaveWise</h2>
            </div>

            <ul>
                <li>
                    <i class="fa-solid fa-border-all"></i>
                    <span>dashboard</span>

                </li>

                <li>
                    <i class="fa-solid fa-plus"></i>
                    <span>add transaction</span>
                </li>


                <li class="active-link">
                    <i class="fa-solid fa-list-ul"></i>
                    <span>categories</span>
                </li>






            </ul>


            <!-- <div class="mode">
                <i class="fa-solid fa-sun"></i>
                <p>dark mode</p>
                <div class="parent">
                    <div class="child"></div>
                </div>
            </div> -->

        </div>


        <div class="category-content">

            <div class="category-head">
                <div>
                    <h1>categories</h1>
                    <p>manage your expense categories.</p>
                </div>

                <button>
                    <i class="fa-solid fa-plus"></i>
                    add category
                </button>
            </div>




            <div class="category-cards">
                <div class="category-card">

                    <i class="fa-solid fa-utensils category-icon cat-food"></i>
                    <div class="category-meta">
                        <h2>food</h2>
                        <p>12 transactions</p>
                    </div>
                    <p class="category-percent">32%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-bus-simple category-icon cat-transport"></i>
                    <div class="category-meta">
                        <h2>transportation</h2>
                        <p>7 transactions</p>
                    </div>
                    <p class="category-percent">18%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-bag-shopping category-icon cat-shopping"></i>
                    <div class="category-meta">
                        <h2>shopping</h2>
                        <p>5 transactions</p>
                    </div>
                    <p class="category-percent">14%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-children category-icon cat-fun"></i>
                    <div class="category-meta">
                        <h2>entertainment</h2>
                        <p>4 transactions</p>
                    </div>
                    <p class="category-percent">12%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-regular fa-file-lines category-icon cat-bills"></i>
                    <div class="category-meta">
                        <h2>bills</h2>
                        <p>3 transactions</p>
                    </div>
                    <p class="category-percent">10%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-ellipsis category-icon cat-other"></i>
                    <div class="category-meta">
                        <h2>other</h2>
                        <p>4 transactions</p>
                    </div>
                    <p class="category-percent">14%</p>

                    <hr>


                    <div class="category-actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>

            </div>



        </div>



    </section>



</body>

</html>
