<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>savewise - category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="app-page category-page">

    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="app-sidebar__brand">
                <span class="app-sidebar__brand-icon"><i class="fa-solid fa-leaf"></i></span>
                <span>savewise</span>
            </div>
            <nav class="app-sidebar__nav">
                <a href="analytics.html" class="app-sidebar__link"><i class="fa-solid fa-chart-column"></i>analytics</a>
                <a href="pe.html" class="app-sidebar__link"><i class="fa-solid fa-plus"></i>add transaction</a>
                <a href="Category.html" class="app-sidebar__link app-sidebar__link--active"><i class="fa-solid fa-list-ul"></i>category</a>
            </nav>
        </aside>

        <main class="app-content category-content">

            <div class="category-head">
                <div>
                    <h1 class="category-head__title">categories</h1>
                    <p class="category-head__subtitle">manage your expense categories.</p>
                </div>

                <button class="category-head__add-btn">
                    <i class="fa-solid fa-plus"></i>
                    add category
                </button>
            </div>

            <div class="category-add-form">
                <input type="text" class="category-add-form__input category-add-form__input--name" placeholder="Enter category Name">
                <input type="number" class="category-add-form__input category-add-form__input--count" placeholder="Enter transactions number">
            </div>

            <div class="category-cards">
                <div class="category-card">

                    <i class="fa-solid fa-utensils category-card__icon category-card__icon--food"></i>
                    <div class="category-card__meta">
                        <h2 class="category-card__name">food</h2>
                        <p class="category-card__count">12 transactions</p>
                    </div>
                    <p class="category-card__percent">32%</p>

                    <hr class="category-card__divider">


                    <div class="category-card__actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-bus-simple category-card__icon category-card__icon--transport"></i>
                    <div class="category-card__meta">
                        <h2 class="category-card__name">transportation</h2>
                        <p class="category-card__count">7 transactions</p>
                    </div>
                    <p class="category-card__percent">18%</p>

                    <hr class="category-card__divider">


                    <div class="category-card__actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-bag-shopping category-card__icon category-card__icon--shopping"></i>
                    <div class="category-card__meta">
                        <h2 class="category-card__name">shopping</h2>
                        <p class="category-card__count">5 transactions</p>
                    </div>
                    <p class="category-card__percent">14%</p>

                    <hr class="category-card__divider">


                    <div class="category-card__actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-children category-card__icon category-card__icon--fun"></i>
                    <div class="category-card__meta">
                        <h2 class="category-card__name">entertainment</h2>
                        <p class="category-card__count">4 transactions</p>
                    </div>
                    <p class="category-card__percent">12%</p>

                    <hr class="category-card__divider">


                    <div class="category-card__actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-regular fa-file-lines category-card__icon category-card__icon--bills"></i>
                    <div class="category-card__meta">
                        <h2 class="category-card__name">bills</h2>
                        <p class="category-card__count">3 transactions</p>
                    </div>
                    <p class="category-card__percent">10%</p>

                    <hr class="category-card__divider">


                    <div class="category-card__actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>
                <div class="category-card">

                    <i class="fa-solid fa-ellipsis category-card__icon category-card__icon--other"></i>
                    <div class="category-card__meta">
                        <h2 class="category-card__name">other</h2>
                        <p class="category-card__count">4 transactions</p>
                    </div>
                    <p class="category-card__percent">14%</p>

                    <hr class="category-card__divider">


                    <div class="category-card__actions">

                        <i class="fa-solid fa-pen"></i>
                        <i class="fa-regular fa-trash-can"></i>

                    </div>
                </div>

            </div>



        </main>
    </div>



<script src="main.js"></script>
<script src="script.js"></script>
</body>

</html>
