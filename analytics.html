<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>savewise - analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-page analytics-page">
<div class="app-shell">
<aside class="app-sidebar">
<div class="app-sidebar__brand">
<span class="app-sidebar__brand-icon"><i class="fa-solid fa-leaf"></i></span>
<span>savewise</span>
</div>
<nav class="app-sidebar__nav">
<a href="analytics.html" class="app-sidebar__link app-sidebar__link--active"><i class="fa-solid fa-chart-column"></i>analytics</a>
<a href="pe.html" class="app-sidebar__link"><i class="fa-solid fa-plus"></i>add transaction</a>
<a href="Category.html" class="app-sidebar__link"><i class="fa-solid fa-list-ul"></i>category</a>
</nav>
</aside>
<main class="app-content">
<header class="analytics-top">
<h1 class="analytics-top__title">analytics</h1>
<a href="pe.html" class="analytics-add-btn">add transaction <i class="fa-solid fa-plus"></i></a>
</header>
<section class="analytics-stats">
<div class="analytics-stat">
<div class="analytics-stat__head">
<div class="analytics-stat__icon analytics-stat__icon--balance"><i class="fa-solid fa-sack-dollar"></i></div>
<span class="analytics-stat__trend analytics-stat__trend--up">+ 12%</span>
</div>
<p class="analytics-stat__label">total balance</p>
<b class="analytics-stat__value">$ 7,550</b>
<p class="analytics-stat__sub">vs last month</p>
</div>
<div class="analytics-stat">
<div class="analytics-stat__head">
<div class="analytics-stat__icon analytics-stat__icon--income"><i class="fa-solid fa-arrow-trend-up"></i></div>
<span class="analytics-stat__trend analytics-stat__trend--up">+ 8%</span>
</div>
<p class="analytics-stat__label">total income</p>
<b class="analytics-stat__value">$ 10,000</b>
<p class="analytics-stat__sub">vs last month</p>
</div>
<div class="analytics-stat">
<div class="analytics-stat__head">
<div class="analytics-stat__icon analytics-stat__icon--expenses"><i class="fa-solid fa-arrow-trend-down"></i></div>
<span class="analytics-stat__trend analytics-stat__trend--down">- 5%</span>
</div>
<p class="analytics-stat__label">total expenses</p>
<b class="analytics-stat__value">$ 2,450</b>
<p class="analytics-stat__sub">vs last month</p>
</div>
<div class="analytics-stat">
<div class="analytics-stat__head">
<div class="analytics-stat__icon analytics-stat__icon--savings"><i class="fa-solid fa-piggy-bank"></i></div>
<span class="analytics-stat__trend analytics-stat__trend--up">+ 15%</span>
</div>
<p class="analytics-stat__label">total savings</p>
<b class="analytics-stat__value">$ 5,100</b>
<p class="analytics-stat__sub">vs last month</p>
</div>
</section>
</main>
</div>
<script src="main.js"></script>
</body>
</html>
