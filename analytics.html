<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>savewise - analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="side-logo">
<span class="logo-icon"><i class="fa-solid fa-leaf"></i></span>
<span>savewise</span>
</div>
<nav class="side-menu">
<a href="analytics.html" class="side-link on"><i class="fa-solid fa-chart-column"></i>analytics</a>
<a href="#" class="side-link"><i class="fa-solid fa-plus"></i>add transaction</a>
<a href="Category.html" class="side-link"><i class="fa-solid fa-list-ul"></i>category</a>
</nav>
</aside>
<main class="content">
<header class="page-top">
<h1>analytics</h1>
<a href="#" class="btn small">add transaction <i class="fa-solid fa-plus"></i></a>
</header>
<section class="stats">
<div class="stat">
<div class="stat-head">
<div class="stat-icon s1"><i class="fa-solid fa-sack-dollar"></i></div>
<span class="trend up">+ 12%</span>
</div>
<p class="stat-label">total balance</p>
<b class="stat-num">$ 7,550</b>
<p class="stat-sub">vs last month</p>
</div>
<div class="stat">
<div class="stat-head">
<div class="stat-icon s2"><i class="fa-solid fa-arrow-trend-up"></i></div>
<span class="trend up">+ 8%</span>
</div>
<p class="stat-label">total income</p>
<b class="stat-num">$ 10,000</b>
<p class="stat-sub">vs last month</p>
</div>
<div class="stat">
<div class="stat-head">
<div class="stat-icon s3"><i class="fa-solid fa-arrow-trend-down"></i></div>
<span class="trend down">- 5%</span>
</div>
<p class="stat-label">total expenses</p>
<b class="stat-num">$ 2,450</b>
<p class="stat-sub">vs last month</p>
</div>
<div class="stat">
<div class="stat-head">
<div class="stat-icon s4"><i class="fa-solid fa-piggy-bank"></i></div>
<span class="trend up">+ 15%</span>
</div>
<p class="stat-label">total savings</p>
<b class="stat-num">$ 5,100</b>
<p class="stat-sub">vs last month</p>
</div>
</section>
</main>
</div>
<script src="main.js"></script>
</body>
</html>
