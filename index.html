<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveWise - Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="app-page category-page">

    <div class="app-shell">
        <aside class="app-sidebar">
            <a href="landing.html" class="app-sidebar__brand">
                <span class="app-sidebar__brand-icon"><i class="fa-solid fa-leaf"></i></span>
                <span>savewise</span>
            </a>
            <nav class="app-sidebar__nav">
                <a href="analytics.html" class="app-sidebar__link"><i class="fa-solid fa-border-all"></i>dashboard</a>
                <a href="pe.html" class="app-sidebar__link"><i class="fa-solid fa-plus"></i>add transaction</a>
                <a href="Category.html" class="app-sidebar__link app-sidebar__link--active"><i class="fa-solid fa-list-ul"></i>categories</a>
            </nav>
        </aside>

        <main class="app-content category-content">

            <div class="category-head">
                <div>
                    <h1 class="category-head__title">categories</h1>
                    <p class="category-head__subtitle">manage your expense categories.</p>
                </div>

                <button class="category-head__add-btn">
                    <i class="fa-solid fa-plus"></i>
                     add category
                </button>
            </div>

            <div class="category-add-form">
                <input type="text" class="category-add-form__input category-add-form__input--name" placeholder="Enter category Name">
                <select class="category-add-form__input category-add-form__input--icon" aria-label="Choose category icon">
                    <option value="" disabled selected>Choose icon</option>
                    <option value="food">Food</option>
                    <option value="transport">Transportation</option>
                    <option value="shopping">Shopping</option>
                    <option value="fun">Entertainment</option>
                    <option value="bills">Bills</option>
                    <option value="other">Other</option>
                </select>
            </div>

        <div class="category-cards">
            
        </div>

        </main>
    </div>

    <div class="cat-modal" id="catModal" hidden>
        <div class="cat-modal-box">
            <div class="cat-modal-top">
                <h2 class="cat-modal-title">Category</h2>
                <button class="cat-modal-close" type="button"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="cat-modal-count"></p>
            <ul class="cat-modal-list"></ul>
        </div>
    </div>

    <script src="store.js?v=2"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
